<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Quiz</title>

  <style>*{box-sizing:border-box}body{font-family:"Segoe UI",sans-serif;background:#f3f5f7;max-width:950px;margin:auto;padding:25px;color:#222;transition:.3s;text-align:center}.vraag{text-align:center}.dark-mode{background:#111;color:#eee}.header{text-align:center;margin-bottom:30px}.header h1{font-size:42px;margin:0}.header p{color:#777}.vraag,#startscherm,#score{background:#fff;border-radius:18px;box-shadow:0 6px 25px rgba(0,0,0,.08)}.dark-mode .vraag,.dark-mode #startscherm,.dark-mode #score{background:#1e1e1e;color:#eee}.vraag{padding:24px;margin-bottom:20px}label{display:block;padding:12px;border:1px solid #ddd;border-radius:12px;margin:10px 0;transition:.2s;text-align:center}label:hover{transform:translateX(4px);background:#f7f9ff}button{background:#0d6efd;color:#fff;border:none;padding:14px 28px;border-radius:10px;cursor:pointer;margin:6px}select{padding:12px;border-radius:10px}.progress-container{height:14px;background:#e9ecef;border-radius:999px;overflow:hidden}.progress-bar{height:100%;width:0;background:#0d6efd;transition:.4s}.correct-answer{background:#dff7df}.wrong-answer{background:#ffe0e0}.medal{font-size:56px}@media(max-width:700px){body{padding:15px}button{width:100%}.header h1{font-size:30px}}
.correct-answer{background:#dff7df}
.wrong-answer{background:#ffe0e0}
.explanation{margin-top:12px;padding:12px;border-radius:10px;background:rgba(0,0,0,.05)}
.dark-mode .correct-answer{background:#1f6b2d!important;color:#fff;border-color:#2d8a42}
.dark-mode .wrong-answer{background:#7a1f1f!important;color:#fff;border-color:#a52d2d}
.dark-mode .explanation{background:rgba(255,255,255,.08)}
.dark-mode a{color:#7db7ff}

</style>
</head>

<body>

<div class="header"><h1>🛡️ Preventie Quiz</h1><p>Test je kennis van veiligheid en preventie</p></div><div id="progressWrap" style="display:none;margin-bottom:20px"><div style="display:flex;justify-content:space-between;align-items:center"><span id="progressText">Vraag 0/0</span><button onclick="toggleDarkMode()">🌙 Donkere modus</button></div><div class="progress-container"><div class="progress-bar" id="progressBar"></div></div></div>

<div id="startscherm">
  <p>Kies aantal vragen:</p>
  <select id="aantal">
    <option value="5">5 vragen</option>
    <option value="10">10 vragen</option>
    <option value="20">20 vragen</option>
    <option value="40">40 vragen</option>
  </select>
  <button onclick="startQuiz()">Start</button>
</div>

<div id="quiz" style="display:none;"></div>

<button id="nakijkBtn" style="display:none;" onclick="nakijken()">
  Nakijken
</button>

<button id="opnieuwBtn" style="display:none;" onclick="nieuweQuiz()">
  Nieuwe quiz
</button>
  
<h2 id="score"></h2>

<script>

let quizData = [];

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function startQuiz() {

  if (!Array.isArray(QUESTIONS) || QUESTIONS.length === 0) {
    alert("Geen geldige vragen gevonden.");
    return;
  }

  let aantal = parseInt(document.getElementById("aantal").value);

  if (aantal > QUESTIONS.length) {
    aantal = QUESTIONS.length;
  }

  quizData = shuffle([...QUESTIONS]).slice(0, aantal);

  document.getElementById("startscherm").style.display = "none";
  document.getElementById("quiz").style.display = "block";
  document.getElementById("nakijkBtn").style.display = "inline-block";

  laadQuiz();
}

function laadQuiz() {

  const quizDiv = document.getElementById("quiz");
  quizDiv.innerHTML="";document.getElementById("progressWrap").style.display="block";

  quizData.forEach((q, index) => {

    let html = `
      <div class="vraag">
        <p><b>${index + 1}. ${q.q}</b></p>
    `;

    q.a.forEach((antwoord, i) => {
      html += `
        <label>
          <input type="radio" name="q${index}" value="${i}">
          ${String.fromCharCode(65 + i)}. ${antwoord}
        </label>
      `;
    });

    html += `
        <p id="feedback${index}"></p>
      </div>
    `;

    quizDiv.innerHTML += html;document.getElementById("progressText").innerText=`Vraag ${index+1} van ${quizData.length}`;document.getElementById("progressBar").style.width=((index+1)/quizData.length*100)+"%";
  });

  enableRadioToggle();
}

function enableRadioToggle() {
  document.querySelectorAll('input[type="radio"]').forEach(radio => {
    radio.addEventListener('mousedown', function() {
      this.dataset.checked = this.checked;
    });
    radio.addEventListener('click', function() {
      if (this.dataset.checked === 'true') {
        this.checked = false;
      }
    });
  });
}


function nakijken() {

  let score = 0;

  quizData.forEach((q, index) => {

    const gekozen =
      document.querySelector(`input[name="q${index}"]:checked`);

    const feedback =
      document.getElementById(`feedback${index}`);

    const antwoorden =
      document.querySelectorAll(`input[name="q${index}"]`);

    antwoorden.forEach((radio, i) => {

      const label = radio.parentElement;

      if (i === q.correct) {
        label.classList.add("correct-answer");
      }

      if (
        gekozen &&
        parseInt(gekozen.value) === i &&
        i !== q.correct
      ) {
        label.classList.add("wrong-answer");
      }

      radio.disabled = true;
    });

    let boodschap = "";
    let klasse = "";

    if (!gekozen) {

      boodschap = "⏭ Niet ingevuld";
      klasse = "";

    }
    else if (parseInt(gekozen.value) === q.correct) {

      score += 1;

      boodschap = "✔ Juist (+1)";
      klasse = "juist";

    }
    else {

      score -= 0.5;

      boodschap = "❌ Fout (-0.5)";
      klasse = "fout";
    }

feedback.innerHTML = `
  ${boodschap}

  <div class="explanation">
    <strong>Uitleg:</strong><br>
    ${q.explanation || "Geen uitleg beschikbaar."}

    ${
      q.source
        ? `<br><br>${
            q.sourceUrl
              ? `<a href="${q.sourceUrl}" target="_blank" rel="noopener noreferrer">${q.source}</a>`
              : q.source
          }`
        : ""
    }
  </div>
`;

    feedback.className = klasse;

  });

  const pct = ((score / quizData.length) * 100).toFixed(1);

  let medal=pct>=80?"🏆":pct>=60?"🥈":"🎯";let txt=pct>=80?"Uitstekend!":pct>=60?"Goed gedaan!":"Blijven oefenen!";document.getElementById("score").innerHTML=`<div class="medal">${medal}</div><h2>Resultaat</h2><h1>${score.toFixed(1)} / ${quizData.length}</h1><h2>${pct}%</h2><p>${txt}</p>`;

  document.getElementById("opnieuwBtn").style.display = "inline-block";
}
function nieuweQuiz() {

  // Quiz leegmaken
  document.getElementById("quiz").innerHTML = "";

  // Score wissen
  document.getElementById("score").innerHTML = "";

  // Knoppen verbergen
  document.getElementById("nakijkBtn").style.display = "none";
  document.getElementById("opnieuwBtn").style.display = "none";

  // Startscherm opnieuw tonen
  document.getElementById("startscherm").style.display = "block";

  // Quiz verbergen
  document.getElementById("quiz").style.display = "none";

  // Variabele leegmaken
  quizData = [];
}
function toggleDarkMode(){document.body.classList.toggle("dark-mode");}
/* HIER START DE VRAGENLIJST */

</script>
<script>
let QUESTIONS = [];

fetch('vragen.json')
  .then(response => response.json())
  .then(data => {
    QUESTIONS = data;
  })
  .catch(error => {
    console.error('Fout bij laden vragen.json:', error);
    alert('Kon vragen.json niet laden.');
  });
</script>
</body>
</html>
