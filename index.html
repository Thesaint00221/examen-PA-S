<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Quiz</title>

  <style>
    body { font-family: Arial; margin: 20px; }
    .vraag { margin-bottom: 20px; padding: 10px; border: 1px solid #ddd; }
    .juist { color: green; font-weight: bold; }
    .fout { color: red; font-weight: bold; }
    .explanation {
      margin-top: 8px;
      padding: 10px;
      background-color: #f8f9fa;
      border-left: 4px solid #4CAF50;
      border-radius: 4px;
      color: #333;
      font-size: 14px;
      line-height: 1.4;
      display: none; /* Standaard verbergen we de uitleg */
    }
    select, button { padding: 8px; font-size: 14px; margin-top: 5px; }
    #startscherm p { margin-bottom: 5px; font-weight: bold; }
    label { display: block; margin: 5px 0; cursor: pointer; }
    
    .correct-answer {
      background-color: #c8f7c5;
      padding: 3px;
      border-radius: 4px;
    }

    .wrong-answer {
      background-color: #ffd6d6;
      padding: 3px;
      border-radius: 4px;
    }
  </style>
</head>

<body>

<h1>Quiz</h1>

<div id="startscherm">
  <p>Kies aantal vragen:</p>
  <select id="aantal">
    <option value="5">5 vragen</option>
    <option value="10">10 vragen</option>
    <option value="20">20 vragen</option>
    <option value="40">40 vragen</option>
  </select>
  <button onclick="startQuiz()">Start</button>
</div>

<div id="quiz" style="display:none;"></div>

<button id="nakijkBtn" style="display:none;" onclick="nakijken()">
  Nakijken
</button>

<button id="opnieuwBtn" style="display:none;" onclick="nieuweQuiz()">
  Nieuwe quiz
</button>
  
<h2 id="score"></h2>

<script>
// VOORBEELDVRAGEN (Zorg dat deze variabele bestaat in je code)
const QUESTIONS = [
  {
    vraag: "Wat is de hoofdstad van Frankrijk?",
    opties: ["Berlijn", "Parijs", "Londen", "Madrid"],
    correct: 1, // Index van het juiste antwoord (Parijs)
    uitleg: "Parijs is de hoofdstad en de grootste stad van Frankrijk."
  },
  {
    vraag: "Hoeveel poten heeft een spin?",
    opties: ["6", "8", "10", "12"],
    correct: 1,
    uitleg: "Spinnen horen bij de achtpootachtigen en hebben dus 8 poten."
  }
];

let quizData = [];

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function startQuiz() {
  if (!Array.isArray(QUESTIONS) || QUESTIONS.length === 0) {
    alert("Geen geldige vragen gevonden.");
    return;
  }

  let aantal = parseInt(document.getElementById("aantal").value);
  if (aantal > QUESTIONS.length) {
    aantal = QUESTIONS.length;
  }

  // Schudden en selecteren van vragen
  quizData = shuffle([...QUESTIONS]).slice(0, aantal);

  // HTML opbouwen voor de quiz
  let quizHtml = "";
  quizData.forEach((q, qIndex) => {
    quizHtml += `<div class="vraag" id="vraag-${qIndex}">`;
    quizHtml += `<p><strong>Vraag ${qIndex + 1}:</strong> ${q.vraag}</p>`;
    
    q.opties.forEach((optie, oIndex) => {
      quizHtml += `
        <label id="label-${qIndex}-${oIndex}">
          <input type="radio" name="vraag-${qIndex}" value="${oIndex}">
          ${optie}
        </label>
      `;
    });

    // Voeg de uitlegbox toe (onzichtbaar via CSS tot nakijken)
    quizHtml += `<div class="explanation" id="uitleg-${qIndex}"><strong>Uitleg:</strong> ${q.uitleg || 'Geen uitleg beschikbaar.'}</div>`;
    quizHtml += `</div>`;
  });

  document.getElementById("quiz").innerHTML = quizHtml;
  
  // Schermen wisselen
  document.getElementById("startscherm").style.display = "none";
  document.getElementById("quiz").style.display = "block";
  document.getElementById("nakijkBtn").style.display = "inline-block";
}

function nakijken() {
  let score = 0;

  quizData.forEach((q, qIndex) => {
    const geselecteerd = document.querySelector(`input[name="vraag-${qIndex}"]:checked`);
    const uitlegBox = document.getElementById(`uitleg-${qIndex}`);
    
    // Toon de uitlegbox voor elke vraag
    if (uitlegBox) {
      uitlegBox.style.display = "block";
    }

    // Markeer het juiste antwoord altijd met groen (.correct-answer)
    const juistLabel = document.getElementById(`label-${qIndex}-${q.correct}`);
    if (juistLabel) {
      juistLabel.classList.add("correct-answer");
    }

    if (geselecteerd) {
      const gekozenAntwoord = parseInt(geselecteerd.value);

      if (gekozenAntwoord === q.correct) {
        score++;
        // Voeg tekstuele feedback toe indien gewenst
        uitlegBox.insertAdjacentHTML('afterbegin', '<span class="juist">Goed!</span> ');
      } else {
        // Fout antwoord rood markeren (.wrong-answer)
        const foutLabel = document.getElementById(`label-${qIndex}-${gekozenAntwoord}`);
        if (foutLabel) {
          foutLabel.classList.add("wrong-answer");
        }
        uitlegBox.insertAdjacentHTML('afterbegin', '<span class="fout">Fout!</span> ');
      }
    } else {
      // Niets ingevuld
      uitlegBox.insertAdjacentHTML('afterbegin', '<span class="fout">Niet beantwoord!</span> ');
    }

    // Radiobuttons uitschakelen na nakijken
    const radioButtons = document.querySelectorAll(`input[name="vraag-${qIndex}"]`);
    radioButtons.forEach(btn => btn.disabled = true);
  });

  // Score tonen en knoppen wisselen
  document.getElementById("score").innerText = `Je score is: ${score} van de ${quizData.length}`;
  document.getElementById("nakijkBtn").style.display = "none";
  document.getElementById("opnieuwBtn").style.display = "inline-block";
}

function nieuweQuiz() {
  // Reset alles naar de beginstand
  document.getElementById("score").innerText = "";
  document.getElementById("quiz").style.display = "none";
  document.getElementById("opnieuwBtn").style.display = "none";
  document.getElementById("startscherm").style.display = "block";
}
</script>

</body>
</html>
