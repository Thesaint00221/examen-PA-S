<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Quiz</title>

  <style>
    body { font-family: Arial; margin: 20px; }
    .vraag { margin-bottom: 20px; padding: 10px; border: 1px solid #ddd; }
    .juist { color: green; font-weight: bold; }
    .fout { color: red; font-weight: bold; }
    select, button { padding: 8px; font-size: 14px; margin-top: 5px; }
    #startscherm p { margin-bottom: 5px; font-weight: bold; }
    label { display: block; margin: 5px 0; cursor: pointer; }
  </style>
</head>

<body>

<h1>Quiz</h1>

<div id="startscherm">
  <p>Kies aantal vragen:</p>
  <select id="aantal">
    <option value="5">5 vragen</option>
    <option value="10">10 vragen</option>
    <option value="20">20 vragen</option>
    <option value="40">40 vragen</option>
  </select>
  <button onclick="startQuiz()">Start</button>
</div>

<div id="quiz" style="display:none;"></div>

<button id="nakijkBtn" style="display:none;" onclick="nakijken()">Nakijken</button>

<h2 id="score"></h2>

<script>
let quizData = [];

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function startQuiz() {
  // Controleert of QUESTIONS (hoofdletters) bestaat uit jouw questions.js
  if (typeof QUESTIONS === 'undefined' || !Array.isArray(QUESTIONS)) {
    alert("questions.js is niet geladen of fout formaat");
    return;
  }

  let aantal = parseInt(document.getElementById("aantal").value);
  if (isNaN(aantal) || aantal < 1) return;

  // Schudt de QUESTIONS lijst
  quizData = shuffle([...QUESTIONS]).slice(0, aantal);

  document.getElementById("startscherm").style.display = "none";
  document.getElementById("quiz").style.display = "block";
  document.getElementById("nakijkBtn").style.display = "inline-block";

  laadQuiz();
}

function laadQuiz() {
  const quizDiv = document.getElementById("quiz");
  quizDiv.innerHTML = "";

  quizData.forEach((q, index) => {
    // Gebruikt q.q in plaats van q.vraag
    let html = `<div class="vraag">
      <p><b>${index + 1}. ${q.q}</b></p>`;

    // Gebruikt q.a in plaats van q.antwoorden
    q.a.forEach((a, i) => {
      html += `
        <label>
          <input type="radio" name="q${index}" value="${i}">
          ${String.fromCharCode(65 + i)}. ${a}
        </label>
      `;
    });

    html += `<p id="feedback${index}"></p></div>`;
    quizDiv.innerHTML += html;
  });
}

function nakijken() {
  let score = 0;

  quizData.forEach((q, index) => {
    const gekozen = document.querySelector(`input[name="q${index}"]:checked`);
    const feedback = document.getElementById(`feedback${index}`);

    // Gebruikt q.correct en q.a
    const juisteAntwoordTekst = q.a[q.correct];

    if (!gekozen) {
      feedback.innerHTML = `Niet ingevuld ❌ (juist: ${String.fromCharCode(65 + q.correct)}. ${juisteAntwoordTekst})`;
      feedback.className = "fout";
      return;
    }

    const gekozenIndex = parseInt(gekozen.value);

    if (gekozenIndex === q.correct) {
      score++;
      feedback.innerHTML = "Juist ✔";
      feedback.className = "juist";
    } else {
      feedback.innerHTML =
        `Fout ❌ jouw antwoord: ${String.fromCharCode(65 + gekozenIndex)}. ${q.a[gekozenIndex]} | juist: ${String.fromCharCode(65 + q.correct)}. ${juisteAntwoordTekst}`;
      feedback.className = "fout";
    }
  });

  const pct = Math.round((score / quizData.length) * 100);

  document.getElementById("score").innerHTML =
    `Score: ${score} / ${quizData.length} (${pct}%)`;
}
</script>

<!-- Zorg dat de naam van het bestand exact klopt op GitHub -->
<script src="questions.js"></script>
</body>
</html>
