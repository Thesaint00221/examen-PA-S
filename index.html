<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Quiz</title>

  <style>
*{box-sizing:border-box}
body{font-family:"Segoe UI",sans-serif;background:#f3f5f7;max-width:950px;margin:auto;padding:30px;color:#222}
.header{text-align:center;margin-bottom:35px}
.header h1{font-size:42px;margin:0}.header p{color:#666;margin-top:8px}
#startscherm,.vraag,#score{background:#fff;border-radius:18px;box-shadow:0 6px 25px rgba(0,0,0,.08)}
#startscherm{padding:25px;text-align:center;margin-bottom:25px}
.vraag{margin-bottom:22px;padding:24px;border:none}
label{display:block;margin:10px 0;padding:12px;border:1px solid #e3e3e3;border-radius:12px;cursor:pointer;transition:.2s}
label:hover{background:#f8f9ff;transform:translateX(4px)}
button{background:#0d6efd;color:#fff;border:none;padding:14px 28px;border-radius:10px;font-size:16px;cursor:pointer;transition:.2s;margin:8px}
button:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(13,110,253,.3)}
select{padding:12px;border-radius:10px;border:1px solid #ddd}
.juist{color:#198754;font-weight:bold}.fout{color:#dc3545;font-weight:bold}
.explanation{margin-top:10px;padding:14px;background:#f8f9fa;border-left:5px solid #4CAF50;border-radius:8px;line-height:1.6}
.correct-answer{background:#dff7df}.wrong-answer{background:#ffe0e0}
#score{padding:25px;text-align:center;margin-top:25px}
</style>
</head>

<body>

<div class="header"><h1>🛡️ Preventie Quiz</h1><p>Test je kennis van veiligheid en preventie</p></div>

<div id="startscherm">
  <p>Kies aantal vragen:</p>
  <select id="aantal">
    <option value="5">5 vragen</option>
    <option value="10">10 vragen</option>
    <option value="20">20 vragen</option>
    <option value="40">40 vragen</option>
  </select>
  <button onclick="startQuiz()">Start</button>
</div>

<div id="quiz" style="display:none;"></div>

<button id="nakijkBtn" style="display:none;" onclick="nakijken()">
  Nakijken
</button>

<button id="opnieuwBtn" style="display:none;" onclick="nieuweQuiz()">
  Nieuwe quiz
</button>
  
<h2 id="score"></h2>

<script>

let quizData = [];

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function startQuiz() {

  if (!Array.isArray(QUESTIONS) || QUESTIONS.length === 0) {
    alert("Geen geldige vragen gevonden.");
    return;
  }

  let aantal = parseInt(document.getElementById("aantal").value);

  if (aantal > QUESTIONS.length) {
    aantal = QUESTIONS.length;
  }

  quizData = shuffle([...QUESTIONS]).slice(0, aantal);

  document.getElementById("startscherm").style.display = "none";
  document.getElementById("quiz").style.display = "block";
  document.getElementById("nakijkBtn").style.display = "inline-block";

  laadQuiz();
}

function laadQuiz() {

  const quizDiv = document.getElementById("quiz");
  quizDiv.innerHTML = "";

  quizData.forEach((q, index) => {

    let html = `
      <div class="vraag">
        <p><b>${index + 1}. ${q.q}</b></p>
    `;

    q.a.forEach((antwoord, i) => {
      html += `
        <label>
          <input type="radio" name="q${index}" value="${i}">
          ${String.fromCharCode(65 + i)}. ${antwoord}
        </label>
      `;
    });

    html += `
        <p id="feedback${index}"></p>
      </div>
    `;

    quizDiv.innerHTML += html;
  });
}
function nakijken() {

  let score = 0;

  quizData.forEach((q, index) => {

    const gekozen =
      document.querySelector(`input[name="q${index}"]:checked`);

    const feedback =
      document.getElementById(`feedback${index}`);

    const antwoorden =
      document.querySelectorAll(`input[name="q${index}"]`);

    antwoorden.forEach((radio, i) => {

      const label = radio.parentElement;

      if (i === q.correct) {
        label.classList.add("correct-answer");
      }

      if (
        gekozen &&
        parseInt(gekozen.value) === i &&
        i !== q.correct
      ) {
        label.classList.add("wrong-answer");
      }

      radio.disabled = true;
    });

    let boodschap = "";
    let klasse = "";

    if (!gekozen) {

      boodschap = "⏭ Niet ingevuld";
      klasse = "";

    }
    else if (parseInt(gekozen.value) === q.correct) {

      score += 1;

      boodschap = "✔ Juist (+1)";
      klasse = "juist";

    }
    else {

      score -= 0.5;

      boodschap = "❌ Fout (-0.5)";
      klasse = "fout";
    }

feedback.innerHTML = `
  ${boodschap}

  <div class="explanation">
    <strong>Uitleg:</strong><br>
    ${q.explanation || "Geen uitleg beschikbaar."}

    ${
      q.source
        ? `<br><br>${
            q.sourceUrl
              ? `<a href="${q.sourceUrl}" target="_blank" rel="noopener noreferrer">${q.source}</a>`
              : q.source
          }`
        : ""
    }
  </div>
`;

    feedback.className = klasse;

  });

  const pct = ((score / quizData.length) * 100).toFixed(1);

  document.getElementById("score").innerHTML =
    `Score: ${score.toFixed(1)} / ${quizData.length} (${pct}%)`;

  document.getElementById("opnieuwBtn").style.display = "inline-block";
}
function nieuweQuiz() {

  // Quiz leegmaken
  document.getElementById("quiz").innerHTML = "";

  // Score wissen
  document.getElementById("score").innerHTML = "";

  // Knoppen verbergen
  document.getElementById("nakijkBtn").style.display = "none";
  document.getElementById("opnieuwBtn").style.display = "none";

  // Startscherm opnieuw tonen
  document.getElementById("startscherm").style.display = "block";

  // Quiz verbergen
  document.getElementById("quiz").style.display = "none";

  // Variabele leegmaken
  quizData = [];
}
/* HIER START DE VRAGENLIJST */

</script>
<script>
let QUESTIONS = [];

fetch('vragen.json')
  .then(response => response.json())
  .then(data => {
    QUESTIONS = data;
  })
  .catch(error => {
    console.error('Fout bij laden vragen.json:', error);
    alert('Kon vragen.json niet laden.');
  });
</script>
</body>
</html>
